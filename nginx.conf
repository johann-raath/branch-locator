server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Container health endpoint
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Data "API": static JSON, cached for 5 minutes.
  location /api/ {
    default_type application/json;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  # Looks like a real endpoint: GET /api/branches -> branches.json
  location = /api/branches {
    default_type application/json;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    try_files /api/branches.json =404;
  }

  # Hashed Angular bundles (main-3RHJ4CVO.js, styles-5INURTSO.css): cache for a year.
  location ~* "^/.+-[A-Z0-9]{8}\.(js|css)$" {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else (index.html, theme-init.js, favicon): always revalidate; SPA fallback for client routes.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
