# Included by every location in nginx.conf (nginx drops server-level add_header once a location sets its own).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Scripts and fonts are self-hosted; the only third party is the OpenStreetMap tile server (images).
# 'unsafe-inline' for styles only: Angular component styles and Leaflet position elements with inline styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
