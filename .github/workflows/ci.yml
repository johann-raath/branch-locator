name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: App tests
        run: npm test -- --watch=false
      - name: Dataset build script tests
        run: npm run data:test
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # uses the Chrome preinstalled on the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build image
        run: docker build -t branch-locator .
      - name: Run it and check the endpoints
        run: |
          docker run -d --name bl -p 8080:8080 branch-locator
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break || sleep 1; done
          curl -fs http://localhost:8080/ | grep -q "app-root"
          curl -fs http://localhost:8080/api/branches.json | grep -q "Capitec"
          curl -fsI http://localhost:8080/ | grep -qi "content-security-policy"
      - run: npm ci
      - name: Browser smoke tests against the container
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
